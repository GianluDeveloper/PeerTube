name: Serverless CI

on:
  pull_request:
    paths:
      - 'serverless-backend/**'
  push:
    branches: ['main']
    paths:
      - 'serverless-backend/**'

permissions:
  contents: read

jobs:
  lint-test-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm run test

      - name: CDK synth
        run: npm run synth
